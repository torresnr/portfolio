<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <h1>Contact Me!</h1>

    <form action="mailto:naidatorres5133@gmail.com" method="POST">
        <h2>Please use the form below to contact me.</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required minlength="1"/><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required/><br>

        <label for="inquiry">Inquiry:</label>
        <input type="text" id="inquiry" name="inquiry" required minlength="1"/><br>

        <button type="submit">Send</button>
    </form>

    <script src="scripts/contact.js"></script>
</body>
</html>
