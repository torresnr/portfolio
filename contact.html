    <h1>Contact Me!</h1>

    <form action="mailto:naidatorres5133@gmail.com" method="POST">

        <input type="email" id="email" name="email" required/><br>

        <input type="text" id="inquiry" name="inquiry" required minlength="1"/><br>

    </form>
